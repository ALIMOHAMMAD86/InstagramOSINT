<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram OSINT Tool - Advanced</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 700px;
            width: 100%;
            padding: 40px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #333;
            font-size: 28px;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
            font-size: 14px;
        }

        .api-selector {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .api-selector label {
            display: block;
            margin-bottom: 10px;
            color: #333;
            font-weight: bold;
            font-size: 14px;
        }

        .api-options {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .api-option {
            flex: 1;
            min-width: 150px;
        }

        .api-option input[type="radio"] {
            margin-right: 8px;
        }

        .api-option label {
            margin: 0;
            display: flex;
            align-items: center;
            font-weight: normal;
            cursor: pointer;
        }

        .input-group {
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
        }

        input[type="text"] {
            flex: 1;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            padding: 15px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .loading {
            text-align: center;
            margin: 20px 0;
            display: none;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .results {
            display: none;
            margin-top: 30px;
        }

        .profile-header {
            display: flex;
            gap: 20px;
            margin-bottom: 25px;
            align-items: flex-start;
        }

        .profile-pic {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 3px solid #667eea;
            overflow: hidden;
            flex-shrink: 0;
        }

        .profile-pic img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .profile-info {
            flex: 1;
        }

        .profile-name {
            font-size: 20px;
            font-weight: bold;
            color: #333;
            margin-bottom: 5px;
        }

        .profile-username {
            color: #667eea;
            font-size: 14px;
            margin-bottom: 8px;
        }

        .profile-verified {
            display: inline-block;
            background: #e3f2fd;
            color: #1565c0;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            margin-bottom: 8px;
        }

        .profile-bio {
            color: #666;
            font-size: 14px;
            line-height: 1.6;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 15px;
            margin: 25px 0;
        }

        .stat-box {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }

        .stat-number {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .stat-label {
            font-size: 14px;
            opacity: 0.9;
        }

        .result-item {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 12px;
            border-left: 4px solid #667eea;
        }

        .result-label {
            color: #667eea;
            font-weight: bold;
            font-size: 12px;
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .result-value {
            color: #333;
            font-size: 16px;
            word-break: break-all;
        }

        .result-value a {
            color: #667eea;
            text-decoration: none;
        }

        .result-value a:hover {
            text-decoration: underline;
        }

        .error {
            background: #fee;
            color: #c33;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            border-left: 4px solid #c33;
            display: none;
        }

        .warning {
            background: #fff3cd;
            color: #856404;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 4px solid #ffc107;
            font-size: 14px;
        }

        .badge {
            display: inline-block;
            padding: 6px 12px;
            background: #f0f0f0;
            border-radius: 20px;
            font-size: 12px;
            margin-right: 8px;
            margin-bottom: 8px;
        }

        .badge.verified {
            background: #e8f5e9;
            color: #2e7d32;
        }

        .badge.private {
            background: #f3e5f5;
            color: #6a1b9a;
        }

        .badge.business {
            background: #e3f2fd;
            color: #1565c0;
        }

        @media (max-width: 500px) {
            .container {
                padding: 20px;
            }

            .header h1 {
                font-size: 22px;
            }

            .input-group {
                flex-direction: column;
            }

            button {
                width: 100%;
            }

            .stats-grid {
                grid-template-columns: 1fr;
            }

            .profile-header {
                flex-direction: column;
                align-items: center;
                text-align: center;
            }

            .api-options {
                flex-direction: column;
            }

            .api-option {
                min-width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📸 Instagram OSINT Tool</h1>
            <p>نام کاربری را وارد کنید و اطلاعات پروفایل را دریافت کنید</p>
        </div>

        <div class="warning">
            ⚠️ این ابزار فقط برای مقاصد آموزشی و اطلاعات عمومی است. قانون را رعایت کنید.
        </div>

        <div class="api-selector">
            <label>انتخاب روش:</label>
            <div class="api-options">
                <div class="api-option">
                    <input type="radio" id="method1" name="method" value="method1" checked>
                    <label for="method1">روش 1 (API رسمی)</label>
                </div>
                <div class="api-option">
                    <input type="radio" id="method2" name="method" value="method2">
                    <label for="method2">روش 2 (Proxy)</label>
                </div>
                <div class="api-option">
                    <input type="radio" id="method3" name="method" value="method3">
                    <label for="method3">روش 3 (GraphQL)</label>
                </div>
            </div>
        </div>

        <div class="input-group">
            <input 
                type="text" 
                id="username" 
                placeholder="نام کاربری Instagram را وارد کنید (بدون @)..."
                autocomplete="off"
            >
            <button onclick="searchProfile()">جستجو</button>
        </div>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>در حال بارگذاری...</p>
        </div>

        <div class="error" id="error"></div>

        <div class="results" id="results"></div>
    </div>

    <script>
        document.getElementById('username').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                searchProfile();
            }
        });

        async function searchProfile() {
            const username = document.getElementById('username').value.trim().replace('@', '');
            const method = document.querySelector('input[name="method"]:checked').value;
            
            if (!username) {
                showError('لطفا نام کاربری را وارد کنید');
                return;
            }

            const loading = document.getElementById('loading');
            const error = document.getElementById('error');
            const results = document.getElementById('results');

            error.style.display = 'none';
            results.style.display = 'none';
            loading.style.display = 'block';

            try {
                let data;
                
                if (method === 'method1') {
                    data = await fetchMethod1(username);
                } else if (method === 'method2') {
                    data = await fetchMethod2(username);
                } else {
                    data = await fetchMethod3(username);
                }

                displayResults(data);
                loading.style.display = 'none';
                results.style.display = 'block';

            } catch (err) {
                loading.style.display = 'none';
                showError(err.message || 'خطا در دریافت اطلاعات. روش دیگری را امتحان کنید.');
            }
        }

        async function fetchMethod1(username) {
            const response = await fetch(`https://www.instagram.com/api/v1/users/web_profile_info/?username=${encodeURIComponent(username)}`, {
                headers: {
                    'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36'
                }
            });

            if (!response.ok) throw new Error('پروفایل یافت نشد');
            const data = await response.json();
            return data.data.user;
        }

        async function fetchMethod2(username) {
            // استفاده از CORS proxy
            const proxyUrl = 'https://api.allorigins.win/raw?url=';
            const targetUrl = `https://www.instagram.com/${username}/?__a=1`;
            const response = await fetch(proxyUrl + encodeURIComponent(targetUrl));

            if (!response.ok) throw new Error('پروفایل یافت نشد');
            const data = await response.json();
            return data.graphql.user;
        }

        async function fetchMethod3(username) {
            // استفاده از GraphQL
            const response = await fetch('https://www.instagram.com/graphql/query/', {
                method: 'POST',
                headers: {
                    'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36',
                    'Content-Type': 'application/x-www-form-urlencoded'
                },
                body: `query_hash=c9100bf08aaf7a52bda2ff002928dd habitatjs&variables={"user_id":"${username}"}`
            });

            if (!response.ok) throw new Error('پروفایل یافت نشد');
            const data = await response.json();
            return data.data.user;
        }

        function displayResults(user) {
            const results = document.getElementById('results');
            
            const verified = user.is_verified ? '✅ تایید شده' : '❌ تایید نشده';
            const private_account = user.is_private ? '🔒 خصوصی' : '🔓 عمومی';
            const business = user.is_business_account ? '💼 تجاری' : '👤 شخصی';

            results.innerHTML = `
                <div class="profile-header">
                    ${user.profile_pic_url_hd ? `
                        <div class="profile-pic">
                            <img src="${user.profile_pic_url_hd}" alt="Profile">
                        </div>
                    ` : ''}
                    <div class="profile-info">
                        <div class="profile-name">${user.full_name || user.username}</div>
                        <div class="profile-username">@${user.username}</div>
                        ${user.is_verified ? '<span class="profile-verified">✓ تایید شده</span>' : ''}
                        <div class="profile-bio">${user.biography || 'بیوگرافی ندارد'}</div>
                    </div>
                </div>

                <div class="stats-grid">
                    <div class="stat-box">
                        <div class="stat-number">${formatNumber(user.follower_count || 0)}</div>
                        <div class="stat-label">دنبال‌کننده</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-number">${formatNumber(user.following_count || 0)}</div>
                        <div class="stat-label">دنبال‌کردن</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-number">${formatNumber(user.media_count || 0)}</div>
                        <div class="stat-label">پست</div>
                    </div>
                </div>

                <div style="margin-bottom: 20px;">
                    ${user.is_verified ? '<span class="badge verified">✓ تایید شده</span>' : ''}
                    ${user.is_private ? '<span class="badge private">🔒 خصوصی</span>' : '<span class="badge">🔓 عمومی</span>'}
                    ${user.is_business_account ? '<span class="badge business">💼 حساب تجاری</span>' : ''}
                </div>

                ${createResultItem('نام کاربری', user.username)}
                ${createResultItem('نام کامل', user.full_name)}
                ${createResultItem('بیوگرافی', user.biography)}
                ${user.external_url ? createResultItem('لینک خارجی', `<a href="${user.external_url}" target="_blank">${user.external_url}</a>`) : ''}
                ${user.business_category_name ? createResultItem('دسته تجاری', user.business_category_name) : ''}
                ${createResultItem('لینک پروفایل', `<a href="https://instagram.com/${user.username}" target="_blank">instagram.com/${user.username}</a>`)}
            `;
        }

        function createResultItem(label, value) {
            return `
                <div class="result-item">
                    <div class="result-label">${label}</div>
                    <div class="result-value">${value || 'موجود نیست'}</div>
                </div>
            `;
        }

        function formatNumber(num) {
            if (num >= 1000000) {
                return (num / 1000000).toFixed(1) + 'M';
            }
            if (num >= 1000) {
                return (num / 1000).toFixed(1) + 'K';
            }
            return num.toString();
        }

        function showError(message) {
            const error = document.getElementById('error');
            error.textContent = '❌ ' + message;
            error.style.display = 'block';
        }
    </script>
</body>
</html>
