<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram OSINT Tool - Web Version</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            width: 100%;
            padding: 40px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #333;
            font-size: 28px;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
            font-size: 14px;
        }

        .input-group {
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
        }

        input[type="text"] {
            flex: 1;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            padding: 15px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .loading {
            text-align: center;
            margin: 20px 0;
            display: none;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .results {
            display: none;
            margin-top: 30px;
        }

        .result-item {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 12px;
            border-left: 4px solid #667eea;
        }

        .result-label {
            color: #667eea;
            font-weight: bold;
            font-size: 12px;
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .result-value {
            color: #333;
            font-size: 16px;
            word-break: break-all;
        }

        .result-value a {
            color: #667eea;
            text-decoration: none;
        }

        .result-value a:hover {
            text-decoration: underline;
        }

        .error {
            background: #fee;
            color: #c33;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            border-left: 4px solid #c33;
            display: none;
        }

        .success-icon {
            color: #4caf50;
            margin-right: 10px;
        }

        .profile-pic {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            margin: 0 auto 20px;
            border: 3px solid #667eea;
            overflow: hidden;
        }

        .profile-pic img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
            margin-top: 20px;
        }

        .stat-box {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }

        .stat-number {
            font-size: 24px;
            font-weight: bold;
        }

        .stat-label {
            font-size: 12px;
            opacity: 0.9;
            margin-top: 5px;
        }

        @media (max-width: 500px) {
            .container {
                padding: 20px;
            }

            .header h1 {
                font-size: 22px;
            }

            .input-group {
                flex-direction: column;
            }

            button {
                width: 100%;
            }

            .stats {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📸 Instagram OSINT</h1>
            <p>نام کاربری را وارد کنید و اطلاعات پروفایل را دریافت کنید</p>
        </div>

        <div class="input-group">
            <input 
                type="text" 
                id="username" 
                placeholder="نام کاربری اینستاگرام را وارد کنید..."
                autocomplete="off"
            >
            <button onclick="searchProfile()">جستجو</button>
        </div>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>در حال بارگذاری...</p>
        </div>

        <div class="error" id="error"></div>

        <div class="results" id="results">
            <div class="profile-pic" id="profilePic" style="display: none;">
                <img id="profileImg" src="" alt="Profile Picture">
            </div>

            <div class="stats" id="stats"></div>

            <div id="detailedInfo"></div>
        </div>
    </div>

    <script>
        // Listen for Enter key
        document.getElementById('username').addEventListener('keypress', function(event) {
            if (event.key === 'Enter') {
                searchProfile();
            }
        });

        async function searchProfile() {
            const username = document.getElementById('username').value.trim();
            
            if (!username) {
                showError('لطفا نام کاربری را وارد کنید');
                return;
            }

            const loading = document.getElementById('loading');
            const error = document.getElementById('error');
            const results = document.getElementById('results');

            // Reset
            error.style.display = 'none';
            results.style.display = 'none';
            loading.style.display = 'block';

            try {
                // Using Instagram's public API endpoint
                const response = await fetch(`https://www.instagram.com/api/v1/users/web_profile_info/?username=${encodeURIComponent(username)}`, {
                    headers: {
                        'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36'
                    }
                });

                if (!response.ok) {
                    throw new Error('پروفایل یافت نشد');
                }

                const data = await response.json();
                displayResults(data.data.user);
                loading.style.display = 'none';
                results.style.display = 'block';

            } catch (err) {
                loading.style.display = 'none';
                showError(err.message || 'خطا در دریافت اطلاعات');
            }
        }

        function displayResults(user) {
            const stats = document.getElementById('stats');
            const detailedInfo = document.getElementById('detailedInfo');
            const profilePic = document.getElementById('profilePic');
            const profileImg = document.getElementById('profileImg');

            // Profile Picture
            if (user.profile_pic_url_hd) {
                profileImg.src = user.profile_pic_url_hd;
                profilePic.style.display = 'block';
            }

            // Stats
            stats.innerHTML = `
                <div class="stat-box">
                    <div class="stat-number">${formatNumber(user.follower_count || 0)}</div>
                    <div class="stat-label">دنبال‌کننده</div>
                </div>
                <div class="stat-box">
                    <div class="stat-number">${formatNumber(user.following_count || 0)}</div>
                    <div class="stat-label">دنبال‌کردن</div>
                </div>
                <div class="stat-box">
                    <div class="stat-number">${formatNumber(user.media_count || 0)}</div>
                    <div class="stat-label">پست</div>
                </div>
            `;

            // Detailed Info
            detailedInfo.innerHTML = `
                ${createResultItem('نام کاربری', user.username)}
                ${createResultItem('نام', user.full_name)}
                ${createResultItem('بیوگرافی', user.biography)}
                ${user.external_url ? createResultItem('لینک خارجی', `<a href="${user.external_url}" target="_blank">${user.external_url}</a>`) : ''}
                ${createResultItem('حساب خصوصی', user.is_private ? '✅ بله' : '❌ خیر')}
                ${createResultItem('تأیید شده', user.is_verified ? '✅ بله' : '❌ خیر')}
                ${createResultItem('حساب تجاری', user.is_business_account ? '✅ بله' : '❌ خیر')}
                ${user.business_category_name ? createResultItem('دسته تجاری', user.business_category_name) : ''}
                ${createResultItem('لینک پروفایل', `<a href="https://instagram.com/${user.username}" target="_blank">instagram.com/${user.username}</a>`)}
            `;
        }

        function createResultItem(label, value) {
            return `
                <div class="result-item">
                    <div class="result-label">${label}</div>
                    <div class="result-value">${value || 'موجود نیست'}</div>
                </div>
            `;
        }

        function formatNumber(num) {
            if (num >= 1000000) {
                return (num / 1000000).toFixed(1) + 'M';
            }
            if (num >= 1000) {
                return (num / 1000).toFixed(1) + 'K';
            }
            return num.toString();
        }

        function showError(message) {
            const error = document.getElementById('error');
            error.textContent = '❌ ' + message;
            error.style.display = 'block';
        }
    </script>
</body>
</html>
